name: code.daemon pet

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - '.github/code-daemon/**'
      - '.github/workflows/code-daemon.yml'

permissions:
  contents: write

concurrency:
  group: code-daemon
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render pet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PET_TOKEN: ${{ secrets.PET_TOKEN }}   # optional: classic token with repo + read:user
          PET_SALT: ${{ secrets.PET_SALT }}     # optional: random string that hides private repo names in state.json
          PET_NAME: dmn
          PET_THEME: classic                     # classic, derp, slavic, demonic or succubus
          TZ: Europe/Istanbul                    # your time zone, for late nights and streak days
        run: node .github/code-daemon/render.cjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-daemon
          if git diff --cached --quiet; then
            echo "Pet unchanged."
          else
            git commit -m "code.daemon: feed the pet"
            git push
          fi
